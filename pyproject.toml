[project]
name = "market-data"
version = "0.1.5"
description = "Unified A-share and Taiwan market data pipeline"
requires-python = ">=3.12,<3.14"
dependencies = ["duckdb>=1.5.5", "msgpack>=1.1,<2", "pandas>=3.0.5"]

[project.optional-dependencies]
alerts = ["lark-alert @ git+https://github.com/Ye-Yu-Mo/lark_alert@v0.2.1"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pyright>=1.1,<2"]

[project.scripts]
market_data = "market_data.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "PIE", "SIM", "UP", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not network"]
markers = ["network: talks to a live free-stockdb service; excluded unless asked for"]
